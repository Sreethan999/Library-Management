<!DOCTYPE html>
<html>
<head>

    <title>User Form</title>

    <style>

        body{
            font-family:Arial;
            margin:40px;
            background:#f5f5f5;
        }

        form{
            width:400px;
            background:white;
            padding:20px;
            border-radius:5px;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }

        a{
            margin-left:15px;
        }

    </style>

</head>

<body>

<h1>User Form</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">

        Save User

    </button>

    <a href="{% url 'users' %}">

        Cancel

    </a>

</form>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Users</title>

    <style>
        body{
            font-family:Arial;
            margin:40px;
            background:#f5f5f5;
        }

        h1{
            color:#333;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:10px;
            text-align:left;
        }

        th{
            background:#007bff;
            color:white;
        }

        a{
            text-decoration:none;
            padding:6px 10px;
            border-radius:4px;
        }

        .add{
            background:green;
            color:white;
        }

        .edit{
            background:orange;
            color:white;
        }

        .delete{
            background:red;
            color:white;
        }

        .home{
            background:#555;
            color:white;
        }
    </style>

</head>
<body>

<h1>Library Users</h1>

<p>
    <a href="{% url 'home' %}" class="home">Home</a>
    <a href="{% url 'add_user' %}" class="add">Add User</a>
</p>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Actions</th>
</tr>

{% for user in users %}

<tr>

    <td>{{ user.id }}</td>

    <td>{{ user.name }}</td>

    <td>{{ user.email }}</td>

    <td>{{ user.phone }}</td>

    <td>

        <a href="{% url 'edit_user' user.id %}" class="edit">
            Edit
        </a>

        <a href="{% url 'delete_user' user.id %}"
           class="delete"
           onclick="return confirm('Delete this user?');">

            Delete

        </a>

    </td>

</tr>

{% empty %}

<tr>

<td colspan="5">
No users found.
</td>

</tr>

{% endfor %}

</table>

</body>
</html>
